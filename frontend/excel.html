<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key Artifact Generator V1.0</title>
<link rel="stylesheet" href="css/excel.css">
</head>
<body>

<!-- Title bar -->
<div id="titlebar">
  <span class="xl-icon">X</span>
  <span>Microsoft Excel - Key Artifact Generator-V1.0.xls &nbsp;[Web Edition]</span>
  <select id="layoutSelect" title="Switch layout" aria-label="Switch layout"
    style="margin-left:auto; font-size:12px; font-weight:600; padding:5px 8px; border-radius:6px; border:none;">
    <option value="/">Modern UI</option>
    <option value="/excel" selected>Excel UI</option>
    <option value="/webapp">Web App UI</option>
  </select>
</div>

<!-- Menu bar -->
<div id="menubar">
  <span class="menu-item" data-menu="file">File</span>
  <span class="menu-item" data-menu="edit">Edit</span>
  <span class="menu-item" data-menu="view">View</span>
  <span class="menu-item" data-menu="insert">Insert</span>
  <span class="menu-item" data-menu="tools">Tools</span>
  <span class="menu-item" data-menu="data">Data</span>
  <span class="menu-item" data-menu="help">Help</span>
</div>
<div id="menu-dropdowns"></div>

<!-- Toolbar -->
<div id="toolbar">
  <label>Project:</label>
  <select id="projectSelect" title="Active project"></select>
  <span class="sep"></span>
  <button id="btnSave" title="Save all edits">&#128190; Save</button>
  <button id="btnGenWbs" title="Generate WBS (GenWBS2)">&#9881; Generate WBS</button>
  <span class="sep"></span>
  <label>Select Artifact to Copy:</label>
  <select id="cmbArtiName"></select>
  <button id="btnCopyToDesktop" title="Copy artifact to Desktop (download)">Copy To Desktop</button>
  <span class="sep"></span>
  <span id="protectBox">
    <label><input type="radio" name="protect" id="rbProtect"> Protect</label>
    <label><input type="radio" name="protect" id="rbUnprotect" checked> Unprotect</label>
  </span>
</div>

<!-- Formula bar -->
<div id="formulabar">
  <span class="cellref" id="cellRef">A1</span>
  <span>&#402;x</span>
  <span id="cellValue"></span>
</div>

<!-- Work area -->
<div id="workarea">
  <!-- Left panel: ActiveX controls of the Data Sheet -->
  <div id="leftpanel">
    <button class="lbl-project" id="lblProject">GICPI V1110</button>

    <fieldset>
      <legend>Sheet Protection</legend>
      <div class="radio-row"><input type="radio" name="protect2" id="rbProtect2"><label for="rbProtect2">Protect</label></div>
      <div class="radio-row"><input type="radio" name="protect2" id="rbUnprotect2" checked><label for="rbUnprotect2">Unprotect</label></div>
    </fieldset>

    <button class="datalabel" id="lblAppData">Application-Data<br><small>Application Details, Hardware,<br>Software, Environments</small></button>
    <select id="comboAppData"></select>

    <button class="datalabel" id="lblProjData">Project-Data<br><small>Summary, Milestones, Effort,<br>HR Plan, Risks</small></button>
    <select id="comboProjData"></select>

    <button class="datalabel" id="lblResData">Resource-Data<br><small>IPN, Roles, Names</small></button>
    <select id="comboResData"></select>

    <button class="datalabel" id="lblStdData">Standards-Data<br><small>Roles &amp; Responsibilities,<br>Tools, Stakeholder Matrix</small></button>
    <select id="comboStdData"></select>

    <div class="arti-box">
      <label style="font-size:10px;font-weight:bold;">Select Artifact to Copy</label>
      <select id="cmbArtiName2"></select>
      <button class="btn-desktop" id="btnCopyToDesktop2">Copy To Desktop</button>
    </div>

    <button class="cmd-menu" id="cmdMenu">Menu</button>
  </div>

  <!-- Sheets -->
  <div id="sheetarea"></div>
</div>

<!-- Bottom sheet tabs -->
<div id="tabbar"></div>
<div id="statusbar">
  <span id="statusMsg">Ready</span>
  <span id="statusRight">NUM</span>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/sheets/datasheet.js"></script>
<script src="js/sheets/kickoff.js"></script>
<script src="js/sheets/ain.js"></script>
<script src="js/sheets/ainproject.js"></script>
<script src="js/sheets/ippappinfo.js"></script>
<script src="js/sheets/ippscope.js"></script>
<script src="js/sheets/ippstakeholder.js"></script>
<script src="js/sheets/ippconfig.js"></script>
<script src="js/sheets/ippprocess.js"></script>
<script src="js/sheets/wbsjira.js"></script>
<script src="js/sheets/folderstructure.js"></script>
<script>window.addEventListener('DOMContentLoaded', () => {
  App.init().catch((e) => {
    console.error(e);
    msgBox('Failed to start: ' + e.message + '\n\nIs the backend running and the database set up?\nRun: npm run db:setup');
  });
});</script>
</body>
</html>
